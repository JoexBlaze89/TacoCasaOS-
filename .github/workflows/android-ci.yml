name: Android CI

on:
  push:
    branches: [main, authoritative-event-ledger]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android instrumentation tests
        run: gradle --no-daemon :app:connectedDebugAndroidTest
